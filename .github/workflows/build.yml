name: Build PyTorch ARM64 wheel for Oryon Gen 2 (SM8750)

on:
  workflow_dispatch:
    inputs:
      torch_ref:
        description: "PyTorch git ref (tag, branch, or commit)"
        required: true
        default: "v2.13.0"

      python_version:
        description: "Python version"
        required: true
        default: "3.14"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    env:
      PYTHON_VERSION: ${{ inputs.python_version }}

    steps:
      - name: Confirm ARM64 runner
        run: |
          uname -m
          lscpu
          grep -m1 Features /proc/cpuinfo || true

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true

          sudo apt-get clean
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            scons \
            ccache \
            python3-dev \
            libopenblas-dev \
            libomp-dev \
            libvulkan-dev \
            glslang-tools \
            libshaderc-dev \
            pkg-config

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Create build environment
        run: |
          python -m venv "$HOME/build-env"
          echo "$HOME/build-env/bin" >> "$GITHUB_PATH"

          python --version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            numpy \
            pyyaml \
            typing_extensions \
            requests \
            ninja \
            cmake \
            build

      - name: Build Arm Compute Library
        run: |
          git clone \
            --depth 1 \
            --branch v25.02 \
            https://github.com/ARM-software/ComputeLibrary.git \
            "$HOME/ComputeLibrary"

          cd "$HOME/ComputeLibrary"

          # ACL does not expose armv8.7-a as a build target.
          # armv8.6-a enables the relevant ARMv8.6+ CPU paths.
          scons \
            Werror=1 \
            -j"$(nproc)" \
            debug=0 \
            neon=1 \
            opencl=0 \
            embed_kernels=0 \
            os=linux \
            arch=armv8.6-a \
            build=native \
            multi_isa=1

          echo "ACL_ROOT_DIR=$HOME/ComputeLibrary" >> "$GITHUB_ENV"

      - name: Checkout PyTorch
        run: |
          git clone \
            https://github.com/pytorch/pytorch.git \
            "$HOME/pytorch"

          cd "$HOME/pytorch"

          git fetch --depth=1 origin "${{ inputs.torch_ref }}"
          git checkout FETCH_HEAD

          git submodule sync
          git submodule update --init --recursive --depth 1

      - name: Configure build settings
        run: |
          echo "MAX_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Build PyTorch wheel
        working-directory: ${{ env.HOME }}/pytorch
        env:

          # Oryon Gen 2 ISA
          CFLAGS: "-march=armv8.7-a+dotprod+i8mm+bf16 -O3"
          CXXFLAGS: "-march=armv8.7-a+dotprod+i8mm+bf16 -O3"

          # CPU backends
          USE_CUDA: "0"
          USE_ROCM: "0"

          USE_MKLDNN: "1"
          USE_MKLDNN_ACL: "1"

          USE_XNNPACK: "1"
          USE_QNNPACK: "0"
          USE_NNPACK: "0"

          # Disable distributed features
          USE_DISTRIBUTED: "0"
          USE_MPI: "0"
          USE_GLOO: "0"
          USE_NCCL: "0"

          USE_OPENMP: "1"

          # Build size reduction
          BUILD_TEST: "0"
          BUILD_CAFFE2_OPS: "0"

          MAX_JOBS: ${{ env.MAX_JOBS }}

          # Vulkan backend
          USE_VULKAN: "1"
          USE_VULKAN_SHADERC_RUNTIME: "1"
          USE_VULKAN_WRAPPER: "0"

          # XNNPACK ARM optimizations
          CMAKE_ARGS: >-
            -DXNNPACK_ENABLE_ARM_I8MM=ON
            -DXNNPACK_ENABLE_ARM_BF16=ON
            -DACL_ROOT_DIR=${{ env.ACL_ROOT_DIR }}

        run: |
          python -m pip install -r requirements.txt

          python setup.py bdist_wheel

      - name: Verify wheel
        working-directory: ${{ env.HOME }}/pytorch
        run: |
          ls -lh dist/

          pip install dist/*.whl

          python - <<'PY'
          import torch

          print("Torch version:")
          print(torch.__version__)

          print("\nBuild configuration:")
          print(torch.__config__.show())
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: torch-oryon-gen2-py${{ inputs.python_version }}
          path: ${{ env.HOME }}/pytorch/dist/*.whl
          retention-days: 30
