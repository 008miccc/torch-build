name: Build PyTorch wheel for Oryon Gen 2 (SM8750)

# Manual trigger only — this is a long, resource-heavy build.
# Go to Actions tab -> this workflow -> "Run workflow" to start it.
on:
  workflow_dispatch:
    inputs:
      torch_ref:
        description: "PyTorch git ref to build (tag, branch, or commit)"
        required: true
        default: "v2.13.0"
      python_version:
        description: "Python version to build the wheel for"
        required: true
        default: "3.12"

jobs:
  build:
    # Native arm64 runner — no emulation, no cross-compilation.
    # GA for public repos, 4 vCPU here since this repo is public.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350  # PyTorch full builds can run 2-5h even natively; stay under the 6h hard cap with margin

    steps:
      - name: Confirm we're actually on arm64
        run: |
          uname -m
          cat /proc/cpuinfo | grep -m1 Features

      - name: Free up disk space
        # PyTorch source + build artifacts can approach the runner's ~14GB usable disk.
        # Strip stuff we don't need before we start.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            python3 python3-dev python3-venv python3-pip \
            libopenblas-dev libomp-dev \
            ccache
          # ccache speeds up any re-runs of this workflow substantially
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Set up Python venv
        run: |
          python3 -m venv "$HOME/build-env"
          echo "$HOME/build-env/bin" >> "$GITHUB_PATH"

      - name: Install Python build requirements
        run: |
          pip install --upgrade pip
          pip install pyyaml numpy typing_extensions requests

      - name: Clone PyTorch (shallow, single ref, with submodules)
        run: |
          git clone --branch "${{ inputs.torch_ref }}" --depth 1 \
            https://github.com/pytorch/pytorch.git "$HOME/pytorch"
          cd "$HOME/pytorch"
          git submodule sync
          git submodule update --init --recursive --depth 1

      - name: Report target CPU ISA
        run: |
          echo "Building for: armv8.7-a with dotprod, i8mm, bf16"
          echo "This matches 2nd-gen Oryon (Snapdragon 8 Elite / SM8750)."
          echo "NOTE: no sve/sve2/sme on this core generation — do not add them."

      - name: Build PyTorch wheel
        working-directory: /home/runner/pytorch
        env:
          # --- Target ISA for 2nd-gen Oryon (SM8750) ---
          # Confirmed from real /proc/cpuinfo dumps of this core: ARMv8.7-A + dotprod + i8mm + bf16.
          # No sve/sve2/sme flags exist on this generation (that starts with SM8850 / Gen 5 Oryon).
          CFLAGS: "-march=armv8.7-a+dotprod+i8mm+bf16 -O3"
          CXXFLAGS: "-march=armv8.7-a+dotprod+i8mm+bf16 -O3"

          # --- Backend selection ---
          USE_CUDA: "0"
          USE_ROCM: "0"
          USE_MKLDNN: "1"          # oneDNN — has ARM-optimized compute paths
          USE_XNNPACK: "1"         # primary backend actually likely to use i8mm/bf16 GEMM kernels
          USE_QNNPACK: "0"         # legacy quantized backend, superseded by XNNPACK, skip to save build time
          USE_NNPACK: "0"          # not relevant for our target ops, saves build time
          USE_DISTRIBUTED: "0"     # no multi-node training needed for local inference use
          USE_MPI: "0"
          USE_GLOO: "0"
          USE_NCCL: "0"
          USE_OPENMP: "1"
          BUILD_TEST: "0"          # skip building PyTorch's own test suite, saves significant time/disk
          MAX_JOBS: "4"            # match runner vCPU count

          # --- Explicitly force XNNPACK's ARM i8mm kernels on ---
          # This is OFF by default in PyTorch's cmake/Dependencies.cmake regardless of -march,
          # so it must be set explicitly or your i8mm-capable CPU will never use those kernels.
          CMAKE_ARGS: "-DXNNPACK_ENABLE_ARM_I8MM=ON -DXNNPACK_ENABLE_ARM_BF16=ON"

        run: |
          python -m pip install -r requirements.txt
          python setup.py bdist_wheel

      - name: Show resulting wheel and build config
        working-directory: /home/runner/pytorch
        run: |
          ls -lh dist/
          pip install dist/*.whl
          python -c "import torch; print(torch.__config__.show())"
          python -c "import torch; print('i8mm/bf16 build — verify via cpuinfo below'); import torch.backends"

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch-oryon2-py${{ inputs.python_version }}
          path: /home/runner/pytorch/dist/*.whl
          retention-days: 30
