name: Build PyTorch wheel for Oryon Gen 2 (SM8750)

# Manual trigger only — this is a long, resource-heavy build.
# Go to Actions tab -> this workflow -> "Run workflow" to start it.
on:
  workflow_dispatch:
    inputs:
      torch_ref:
        description: "PyTorch git ref to build (tag, branch, or commit)"
        required: true
        default: "v2.13.0"
      python_version:
        description: "Python version to build the wheel for"
        required: true
        default: "3.12"

jobs:
  build:
    # Native arm64 runner — no emulation, no cross-compilation.
    # GA for public repos, 4 vCPU here since this repo is public.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350  # PyTorch full builds can run 2-5h even natively; stay under the 6h hard cap with margin

    steps:
      - name: Confirm we're actually on arm64
        run: |
          uname -m
          cat /proc/cpuinfo | grep -m1 Features

      - name: Free up disk space
        # PyTorch source + build artifacts can approach the runner's ~14GB usable disk.
        # Strip stuff we don't need before we start.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git scons \
            python3 python3-dev python3-venv python3-pip \
            libopenblas-dev libomp-dev \
            libvulkan-dev glslang-tools libshaderc-dev \
            ccache
          # ccache speeds up any re-runs of this workflow substantially
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Set up Python venv
        run: |
          python3 -m venv "$HOME/build-env"
          echo "$HOME/build-env/bin" >> "$GITHUB_PATH"

      - name: Install Python build requirements
        run: |
          pip install --upgrade pip
          pip install pyyaml numpy typing_extensions requests

      - name: Clone PyTorch (shallow, single ref, with submodules)
        run: |
          git clone --branch "${{ inputs.torch_ref }}" --depth 1 \
            https://github.com/pytorch/pytorch.git "$HOME/pytorch"
          cd "$HOME/pytorch"
          git submodule sync
          git submodule update --init --recursive --depth 1

      - name: Report target CPU ISA
        run: |
          echo "Building for: armv8.7-a with dotprod, i8mm, bf16"
          echo "This matches 2nd-gen Oryon (Snapdragon 8 Elite / SM8750)."
          echo "NOTE: no sve/sve2/sme on this core generation — do not add them."

      - name: Determine required ACL version from PyTorch's own source
        # PyTorch bundles a specific oneDNN snapshot (third_party/ideep/mkl-dnn),
        # and THAT snapshot's ACL.cmake states the minimum ACL version it accepts —
        # not the standalone oneDNN project's current README, which moves independently
        # and can be ahead of what any given PyTorch release actually vendors.
        # This grep reads the requirement straight from the checked-out ref, so this
        # step can't silently go stale as PyTorch/oneDNN/ACL version independently.
        id: acl_version
        run: |
          ACL_CMAKE="$HOME/pytorch/third_party/ideep/mkl-dnn/cmake/ACL.cmake"
          if [ ! -f "$ACL_CMAKE" ]; then
            echo "Could not find $ACL_CMAKE — submodule layout may have changed."
            exit 1
          fi
          echo "--- Relevant excerpt from PyTorch's vendored ACL.cmake ---"
          grep -i -B2 -A2 "minimum compatible\|ACL_MINIMUM_VERSION\|find_package(ACL" "$ACL_CMAKE" || true
          echo "-----------------------------------------------------------"
          echo "Read the minimum version printed above manually if the next"
          echo "step's chosen tag turns out to be wrong — this step's only"
          echo "job is to surface the real requirement in the log before we guess."

      - name: Build Arm Compute Library (ACL)
        # ACL is oneDNN's recommended GEMM backend on AArch64 (fp32 + bf16 kernels) —
        # separate from, and complementary to, the XNNPACK i8mm/bf16 kernels below.
        # Not bundled as a PyTorch submodule — built standalone here, then pointed
        # to via ACL_ROOT_DIR during the PyTorch build step.
        #
        # Version note: ACL's own tagging moved from "vYY.MM" (e.g. v25.02) to a
        # "v52.x" scheme partway through 2025. As of this writing the newest
        # published ACL tag is v52.8.0. PyTorch's vendored oneDNN snapshot may
        # require a version at or above this — if the build step below still
        # reports a version mismatch, check the log output from the step above
        # for the exact minimum PyTorch's source actually demands, and update
        # the --branch value here to the closest matching or newer ACL tag
        # (see https://github.com/ARM-software/ComputeLibrary/tags for the
        # current list — do not guess a tag without checking that list first).
        #
        # NOTE: ACL's scons `arch=` option is a fixed enum, NOT a raw -march string —
        # it does not accept "armv8.7-a" (scons prints the valid list on error).
        # armv8.6-a is the correct choice: highest defined floor below our actual
        # armv8.7-a core, without implying SVE/SVE2/SME (which this CPU lacks).
        # This only affects how ACL's own kernels are compiled — the PyTorch/
        # XNNPACK -march flags below stay at armv8.7-a, since GCC/Clang's -march
        # is a different mechanism that does correctly accept armv8.7-a directly.
        run: |
          git clone --depth 1 --branch v52.8.0 \
            https://github.com/ARM-software/ComputeLibrary.git "$HOME/ComputeLibrary"
          cd "$HOME/ComputeLibrary"
          scons Werror=1 -j4 debug=0 neon=1 opencl=0 embed_kernels=0 \
            os=linux arch=armv8.6-a build=native multi_isa=1
          echo "ACL_ROOT_DIR=$HOME/ComputeLibrary" >> "$GITHUB_ENV"

      - name: Build PyTorch wheel
        working-directory: /home/runner/pytorch
        env:
          # --- Target ISA for 2nd-gen Oryon (SM8750) ---
          # Confirmed from real /proc/cpuinfo dumps of this core: ARMv8.7-A + dotprod + i8mm + bf16.
          # No sve/sve2/sme flags exist on this generation (that starts with SM8850 / Gen 5 Oryon).
          CFLAGS: "-march=armv8.7-a+dotprod+i8mm+bf16 -O3"
          CXXFLAGS: "-march=armv8.7-a+dotprod+i8mm+bf16 -O3"

          # --- Backend selection ---
          USE_CUDA: "0"
          USE_ROCM: "0"
          USE_MKLDNN: "1"          # oneDNN — has ARM-optimized compute paths
          USE_MKLDNN_ACL: "1"      # route oneDNN's GEMM ops through Arm Compute Library (fp32/bf16 kernels)
          USE_XNNPACK: "1"         # primary backend actually likely to use i8mm/bf16 GEMM kernels
          USE_QNNPACK: "0"         # legacy quantized backend, superseded by XNNPACK, skip to save build time
          USE_NNPACK: "0"          # not relevant for our target ops, saves build time
          USE_DISTRIBUTED: "0"     # no multi-node training needed for local inference use
          USE_MPI: "0"
          USE_GLOO: "0"
          USE_NCCL: "0"
          USE_OPENMP: "1"
          BUILD_TEST: "0"          # skip building PyTorch's own test suite, saves significant time/disk
          MAX_JOBS: "4"            # match runner vCPU count

          # --- Vulkan backend ---
          # NOTE: upstream PyTorch documents this backend as no longer maintained
          # (superseded by ExecuTorch's Vulkan delegate, which doesn't apply here —
          # ComfyUI needs eager-mode classic torch, not an exported/lowered model).
          # Included per explicit request. May fail to build against current PyTorch
          # source since it's an unmaintained code path; if so, this step is the first
          # thing to strip out, everything else in this build is independent of it.
          USE_VULKAN: "1"
          USE_VULKAN_SHADERC_RUNTIME: "1"
          USE_VULKAN_WRAPPER: "0"

          # --- Explicitly force XNNPACK's ARM i8mm kernels on ---
          # This is OFF by default in PyTorch's cmake/Dependencies.cmake regardless of -march,
          # so it must be set explicitly or your i8mm-capable CPU will never use those kernels.
          #
          # ACL_ROOT_DIR is already exported as a real environment variable via GITHUB_ENV
          # in the earlier ACL build step, so it's directly usable in this shell — no need
          # to route it through a ${{ env.* }} expression here.
          CMAKE_ARGS: "-DXNNPACK_ENABLE_ARM_I8MM=ON -DXNNPACK_ENABLE_ARM_BF16=ON"

        run: |
          python -m pip install -r requirements.txt
          python setup.py bdist_wheel

      - name: Show resulting wheel and build config
        working-directory: /home/runner/pytorch
        run: |
          ls -lh dist/
          pip install dist/*.whl
          python -c "import torch; print(torch.__config__.show())"
          echo "--- Check the build config above for: ---"
          echo "  USE_MKLDNN=1, USE_MKLDNN_ACL (or ACL/Compute Library mentioned)"
          echo "  USE_XNNPACK=1"
          echo "  USE_VULKAN=1 (if the Vulkan build step didn't fail)"
          echo "  no CUDA/ROCm references"

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch-oryon2-py${{ inputs.python_version }}
          path: /home/runner/pytorch/dist/*.whl
          retention-days: 30
